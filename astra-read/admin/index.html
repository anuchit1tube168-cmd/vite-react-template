<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101317">
<title>ASTRA Read — Admin</title>
<style>
:root{--bg:#0d1014;--panel:#151a21;--panel2:#1b222c;--line:#29313d;--ink:#f4efe7;--muted:#9ca7b4;--gold:#d7b56d;--good:#7dd3a7;--bad:#ff8e8e;--r:18px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -10%,#263448 0,transparent 36%),var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,"Noto Sans Thai",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:14px 22px;background:rgba(13,16,20,.9);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.12em}.brand span{color:var(--gold)}.top a{color:var(--muted);text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:24px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end;margin:10px 0 20px}.hero h1{font-size:34px;margin:0}.muted{color:var(--muted)}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:6px 10px;color:var(--gold);background:#171a1d}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.stat,.card{background:linear-gradient(180deg,var(--panel),#11161c);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 18px 50px rgba(0,0,0,.18)}.stat{padding:16px}.stat b{font-size:26px;display:block}.stat span{font-size:11px;color:var(--muted)}.tabs{display:flex;gap:8px;overflow:auto;margin:20px 0}.tabs button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:9px 13px}.tabs button.on,.btn.primary{background:var(--gold);border-color:var(--gold);color:#211b0e;font-weight:800}.btn.danger{border-color:#64333a;color:#ffb8b8}.card{padding:18px;margin-bottom:14px}.two{display:grid;grid-template-columns:1.05fr .95fr;gap:14px}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:#0f141a;color:var(--ink);border-radius:12px;padding:10px 12px;outline:none}textarea{min-height:110px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);background:#10151b;border-radius:14px;padding:12px;display:flex;gap:12px;justify-content:space-between;align-items:flex-start}.item h3,.item p{margin:0}.item small{color:var(--muted)}.itemActions{display:flex;gap:6px;flex-wrap:wrap}.mini{padding:6px 9px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--ink)}.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px}.gate{max-width:620px;margin:9vh auto;padding:28px}.gate h2{font-size:26px}.notice{border:1px solid #5b4a25;background:#211d13;border-radius:12px;padding:10px 12px;color:#ead49d}.ok{color:var(--good)}.err{color:var(--bad)}.hidden{display:none!important}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.chapterBody{min-height:320px}.supportMsg{white-space:pre-wrap;max-width:720px}.audit{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.spinner{opacity:.65;animation:pulse 1.1s infinite}@keyframes pulse{50%{opacity:.3}}@media(max-width:800px){.wrap{padding:16px}.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero{align-items:start;flex-direction:column}.top{padding:12px 16px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><span>ASTRA</span> READ · ADMIN</div><a href="/">← กลับหน้าอ่าน</a></header>
<main class="wrap">
<section id="gate" class="card gate"><h2>กำลังตรวจสิทธิ์…</h2><p class="muted spinner">ตรวจ session และ Owner role</p></section>
<section id="app" class="hidden">
  <div class="hero"><div><span class="badge" id="roleBadge">ADMIN</span><h1>Command Center</h1><p class="muted">จัดการนิยาย ตอนอ่าน Support และ Audit โดยไม่ต้องแก้ D1 ด้วยมือ</p></div><div id="who" class="muted"></div></div>
  <div id="stats" class="grid"></div>
  <nav class="tabs"><button class="on" data-tab="books">Books</button><button data-tab="chapters">Chapters</button><button data-tab="support">Support</button><button data-tab="audit">Audit Log</button></nav>
  <section id="books" data-panel></section>
  <section id="chapters" data-panel class="hidden"></section>
  <section id="support" data-panel class="hidden"></section>
  <section id="audit" data-panel class="hidden"></section>
</section>
</main>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(path,opt={})=>{const r=await fetch(path,{credentials:'same-origin',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'request_failed'),{status:r.status,data:d});return d};
let status=null,books=[],activeBook=null;
async function init(){try{status=await api('/api/admin/status');if(!status.signed_in)return gate('<h2>ต้องเข้าสู่ระบบก่อน</h2><p class="muted">เข้าสู่ระบบ ASTRA Read ด้วยบัญชีที่จะใช้เป็นผู้ดูแล แล้วกลับมาหน้านี้</p><a class="btn primary" href="/">ไปหน้า Sign In</a>');if(!status.owner_exists)return gate('<h2>ตั้งค่า Owner ครั้งแรก</h2><p class="muted">บัญชีนี้: <b>'+esc(status.user.email)+'</b></p><div class="notice">Bootstrap ใช้ได้ครั้งเดียวเท่านั้น เมื่อสร้าง Owner แล้ว endpoint จะปิดอัตโนมัติ</div><div class="field"><label>Owner Bootstrap Token</label><input id="bootToken" type="password" autocomplete="off"></div><button class="btn primary" id="bootBtn">ตั้งบัญชีนี้เป็น Owner</button><p id="bootMsg"></p>');if(!status.user.role)return gate('<h2>บัญชีนี้ยังไม่มีสิทธิ์ Admin</h2><p class="muted">Owner ต้องเพิ่มสิทธิ์ให้บัญชี <b>'+esc(status.user.email)+'</b></p><a class="btn" href="/">กลับหน้าอ่าน</a>');$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');$('#roleBadge').textContent=status.user.role.toUpperCase();$('#who').textContent=status.user.display_name+' · '+status.user.email;await Promise.all([loadDashboard(),loadBooks()]);}catch(e){gate('<h2 class="err">Admin API ใช้งานไม่ได้</h2><p>'+esc(e.message)+'</p>')}}
function gate(html){$('#gate').innerHTML=html;const b=$('#bootBtn');if(b)b.onclick=bootstrap}
async function bootstrap(){const b=$('#bootBtn'),m=$('#bootMsg');b.disabled=true;m.textContent='กำลังตั้งค่า…';try{await api('/api/admin/bootstrap',{method:'POST',body:JSON.stringify({token:$('#bootToken').value})});m.className='ok';m.textContent='สำเร็จ — บัญชีนี้เป็น Owner แล้ว';setTimeout(()=>location.reload(),500)}catch(e){m.className='err';m.textContent=e.message;b.disabled=false}}
async function loadDashboard(){const d=await api('/api/admin/dashboard'),s=d.stats;$('#stats').innerHTML=[['Books',s.books],['Chapters',s.chapters],['Users',s.users],['Open Support',s.open_support],['Audit Events',s.audit_events]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('')}
async function loadBooks(){const d=await api('/api/admin/books');books=d.items||[];renderBooks()}
function renderBooks(){const p=$('#books');p.innerHTML='<div class="two"><div class="card"><div class="toolbar"><div><h2>Books</h2><p class="muted">'+books.length+' เรื่อง</p></div><button class="btn primary" id="newBook">＋ New Book</button></div><div class="list">'+(books.length?books.map(b=>'<div class="item"><div><h3>'+esc(b.title)+'</h3><small>'+esc(b.id)+' · '+esc(b.author)+' · '+esc(b.genre)+' · '+b.chapter_count+' ตอน</small></div><div class="itemActions"><button class="mini" data-edit-book="'+esc(b.id)+'">Edit</button><button class="mini" data-open-chapters="'+esc(b.id)+'">Chapters</button></div></div>').join(''):'<div class="empty">ยังไม่มีหนังสือ</div>')+'</div></div><div class="card" id="bookForm">'+bookForm()+'</div></div>';$('#newBook').onclick=()=>{$('#bookForm').innerHTML=bookForm()};p.querySelectorAll('[data-edit-book]').forEach(x=>x.onclick=()=>{$('#bookForm').innerHTML=bookForm(books.find(b=>b.id===x.dataset.editBook))});p.querySelectorAll('[data-open-chapters]').forEach(x=>x.onclick=()=>openChapters(x.dataset.openChapters));bindBookForm()}
function bookForm(b={}){return '<h2>'+(b.id?'Edit Book':'Create Book')+'</h2><div class="field"><label>Slug / ID</label><input id="bId" '+(b.id?'disabled':'')+' value="'+esc(b.id||'')+'" placeholder="my-story"></div><div class="field"><label>ชื่อเรื่อง</label><input id="bTitle" value="'+esc(b.title||'')+'"></div><div class="row"><div class="field" style="flex:1"><label>ผู้เขียน</label><input id="bAuthor" value="'+esc(b.author||'')+'"></div><div class="field" style="flex:1"><label>Genre</label><input id="bGenre" value="'+esc(b.genre||'Fantasy')+'"></div></div><div class="row"><div class="field" style="flex:1"><label>Status</label><select id="bStatus"><option '+(b.status!=='Completed'?'selected':'')+'>Ongoing</option><option '+(b.status==='Completed'?'selected':'')+'>Completed</option></select></div><div class="field" style="flex:1"><label>Rating</label><input id="bRating" type="number" min="0" max="5" step="0.1" value="'+esc(b.rating??4.8)+'"></div><div class="field" style="flex:1"><label>Accent</label><input id="bAccent" value="'+esc(b.accent||'#5B5BD6')+'"></div></div><div class="field"><label>เรื่องย่อ</label><textarea id="bDesc">'+esc(b.description||'')+'</textarea></div><button class="btn primary" id="saveBook" data-editing="'+esc(b.id||'')+'">บันทึก</button><span id="bookMsg" class="muted"></span>'}
function bindBookForm(){const s=$('#saveBook');if(!s)return;s.onclick=async()=>{const id=$('#bId').value.trim(),editing=s.dataset.editing,payload={id,title:$('#bTitle').value,author:$('#bAuthor').value,genre:$('#bGenre').value,status:$('#bStatus').value,rating:Number($('#bRating').value),accent:$('#bAccent').value,description:$('#bDesc').value};s.disabled=true;$('#bookMsg').textContent=' กำลังบันทึก…';try{await api(editing?'/api/admin/books/'+encodeURIComponent(editing):'/api/admin/books',{method:editing?'PUT':'POST',body:JSON.stringify(payload)});$('#bookMsg').className='ok';$('#bookMsg').textContent=' บันทึกแล้ว';await Promise.all([loadBooks(),loadDashboard()])}catch(e){$('#bookMsg').className='err';$('#bookMsg').textContent=' '+e.message;s.disabled=false}}}
async function openChapters(id){activeBook=id;document.querySelector('[data-tab="chapters"]').click();await loadChapters()}
async function loadChapters(){if(!activeBook)activeBook=books[0]?.id;if(!activeBook)return $('#chapters').innerHTML='<div class="empty">สร้าง Book ก่อน</div>';const d=await api('/api/admin/books/'+encodeURIComponent(activeBook)+'/chapters'),items=d.items||[];$('#chapters').innerHTML='<div class="two"><div class="card"><div class="toolbar"><div><h2>Chapters</h2><select id="chapterBook">'+books.map(b=>'<option value="'+esc(b.id)+'" '+(b.id===activeBook?'selected':'')+'>'+esc(b.title)+'</option>').join('')+'</select></div><button class="btn primary" id="newChapter">＋ New Chapter</button></div><div class="list">'+(items.length?items.map(c=>'<div class="item"><div><h3>#'+c.chapter_no+' '+esc(c.title)+'</h3><small>'+(Number(c.is_free)?'FREE':c.coin_price+' Coins')+' · '+c.body_chars+' chars</small></div><button class="mini" data-edit-chapter="'+esc(c.id)+'">Edit</button></div>').join(''):'<div class="empty">ยังไม่มีตอน</div>')+'</div></div><div class="card" id="chapterForm">'+chapterForm()+'</div></div>';$('#chapterBook').onchange=e=>{activeBook=e.target.value;loadChapters()};$('#newChapter').onclick=()=>{$('#chapterForm').innerHTML=chapterForm() ;bindChapterForm()};document.querySelectorAll('[data-edit-chapter]').forEach(x=>x.onclick=()=>editChapter(x.dataset.editChapter));bindChapterForm()}
function chapterForm(c={}){return '<h2>'+(c.id?'Edit Chapter':'Create Chapter')+'</h2><div class="field"><label>ตอนที่</label><input id="cNo" type="number" min="1" '+(c.id?'disabled':'')+' value="'+esc(c.chapter_no||'')+'"></div><div class="field"><label>ชื่อตอน</label><input id="cTitle" value="'+esc(c.title||'')+'"></div><div class="row"><label><input id="cFree" type="checkbox" style="width:auto" '+(c.id?Number(c.is_free)?'checked':'':'checked')+'> ฟรี</label><div class="field"><label>Coin Price</label><input id="cPrice" type="number" min="1" value="'+esc(c.coin_price||10)+'"></div></div><div class="field"><label>เนื้อหา</label><textarea id="cBody" class="chapterBody">'+esc(c.body||'')+'</textarea></div><button class="btn primary" id="saveChapter" data-editing="'+esc(c.id||'')+'">บันทึกตอน</button><span id="chapterMsg" class="muted"></span>'}
function bindChapterForm(){const s=$('#saveChapter');if(!s)return;s.onclick=async()=>{const editing=s.dataset.editing,p={chapter_no:Number($('#cNo').value),title:$('#cTitle').value,body:$('#cBody').value,is_free:$('#cFree').checked,coin_price:Number($('#cPrice').value)};s.disabled=true;try{await api(editing?'/api/admin/chapters/'+encodeURIComponent(editing):'/api/admin/books/'+encodeURIComponent(activeBook)+'/chapters',{method:editing?'PUT':'POST',body:JSON.stringify(p)});$('#chapterMsg').className='ok';$('#chapterMsg').textContent=' บันทึกแล้ว';await Promise.all([loadChapters(),loadDashboard(),loadBooks()])}catch(e){$('#chapterMsg').className='err';$('#chapterMsg').textContent=' '+e.message;s.disabled=false}}}
async function editChapter(id){const d=await api('/api/admin/chapters/'+encodeURIComponent(id));$('#chapterForm').innerHTML=chapterForm(d.item);bindChapterForm()}
async function loadSupport(){const d=await api('/api/admin/support'),items=d.items||[];$('#support').innerHTML='<div class="card"><div class="toolbar"><div><h2>Support Inbox</h2><p class="muted">'+items.filter(x=>x.status==='open').length+' open</p></div><button class="btn" id="refreshSupport">Refresh</button></div><div class="list">'+(items.length?items.map(x=>'<div class="item"><div><h3>'+esc(x.category)+' · '+esc(x.id)+'</h3><small>'+esc(x.contact_email||'')+' '+esc(x.phone||'')+' · '+esc(x.created_at)+'</small><p class="supportMsg">'+esc(x.message)+'</p></div><button class="mini" data-support="'+esc(x.id)+'" data-status="'+(x.status==='open'?'closed':'open')+'">'+(x.status==='open'?'Close':'Reopen')+'</button></div>').join(''):'<div class="empty">ไม่มีรายการ</div>')+'</div></div>';$('#refreshSupport').onclick=loadSupport;document.querySelectorAll('[data-support]').forEach(b=>b.onclick=async()=>{await api('/api/admin/support/'+encodeURIComponent(b.dataset.support),{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await Promise.all([loadSupport(),loadDashboard()])})}
async function loadAudit(){const d=await api('/api/admin/audit'),items=d.items||[];$('#audit').innerHTML='<div class="card"><div class="toolbar"><h2>Audit Log</h2><button class="btn" id="refreshAudit">Refresh</button></div><div class="list audit">'+(items.length?items.map(x=>'<div class="item"><div><b>'+esc(x.action)+'</b> '+esc(x.entity_type)+' '+esc(x.entity_id||'')+'<br><small>'+esc(x.email||x.display_name||'system')+' · '+esc(x.created_at)+'</small></div></div>').join(''):'<div class="empty">ยังไม่มี audit event</div>')+'</div></div>';$('#refreshAudit').onclick=loadAudit}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab));if(b.dataset.tab==='chapters')await loadChapters();if(b.dataset.tab==='support')await loadSupport();if(b.dataset.tab==='audit')await loadAudit()});
init();
</script>
</body></html>
