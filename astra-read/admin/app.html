<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1014"><title>ASTRA Read Admin</title><style>
:root{--bg:#0d1014;--panel:#151a21;--line:#29313d;--ink:#f4efe7;--muted:#9ca7b4;--gold:#d7b56d;--good:#7dd3a7;--bad:#ff8e8e;--r:17px}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 10% -10%,#25334a 0,transparent 36%),var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,"Noto Sans Thai",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:13px 20px;background:#0d1014e8;backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.11em}.brand span{color:var(--gold)}a{color:var(--gold);text-decoration:none}.wrap{max-width:1180px;margin:auto;padding:22px}.card,.stat{background:linear-gradient(180deg,var(--panel),#11161c);border:1px solid var(--line);border-radius:var(--r)}.gate{max-width:560px;margin:7vh auto;padding:26px}.gate h1{margin:0 0 6px}.muted{color:var(--muted)}.field{display:flex;flex-direction:column;gap:5px;margin:10px 0}.field label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;border:1px solid var(--line);background:#0f141a;color:var(--ink);border-radius:11px;padding:10px 12px;outline:none}textarea{min-height:120px;resize:vertical}.btn,.mini{border:1px solid var(--line);background:#1b222c;color:var(--ink);border-radius:11px;padding:9px 12px}.btn.primary{background:var(--gold);border-color:var(--gold);color:#211b0e;font-weight:900}.full{width:100%}.notice{border:1px solid #5b4a25;background:#211d13;border-radius:11px;padding:10px 12px;color:#ead49d}.ok{color:var(--good)}.err{color:var(--bad)}.hidden{display:none!important}.hero{display:flex;justify-content:space-between;gap:14px;align-items:end;margin:8px 0 18px}.hero h1{font-size:34px;margin:2px 0}.badge{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 9px;color:var(--gold)}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.stat{padding:15px}.stat b{font-size:25px;display:block}.stat span{font-size:10px;color:var(--muted)}.tabs{display:flex;gap:7px;overflow:auto;margin:18px 0}.tabs button{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:11px;padding:8px 12px}.tabs button.on{background:var(--gold);color:#211b0e;border-color:var(--gold);font-weight:900}.panelCard{padding:16px;margin-bottom:13px}.two{display:grid;grid-template-columns:1.05fr .95fr;gap:13px}.toolbar,.row{display:flex;gap:8px;align-items:center;justify-content:space-between}.row{justify-content:flex-start}.list{display:flex;flex-direction:column;gap:8px}.item{border:1px solid var(--line);background:#10151b;border-radius:13px;padding:11px;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}.item h3,.item p{margin:0}.item small{color:var(--muted)}.actions{display:flex;gap:5px;flex-wrap:wrap}.mini{padding:6px 8px}.empty{padding:25px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}.chapterBody{min-height:330px}.supportMsg{white-space:pre-wrap;max-width:680px}.audit{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}@media(max-width:800px){.wrap{padding:14px}.stats{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.top{padding:11px 14px}}
</style></head><body><header class="top"><div class="brand"><span>ASTRA</span> READ · ADMIN</div><a href="https://astra-read-static.pages.dev/">Reader ↗</a></header><main class="wrap"><section id="gate" class="card gate"><h1>ASTRA Admin</h1><p class="muted">กำลังตรวจ session…</p></section><section id="app" class="hidden"><div class="hero"><div><span id="roleBadge" class="badge">ADMIN</span><h1>Command Center</h1><p class="muted">Books · Chapters · Support · Audit</p></div><div><span id="who" class="muted"></span> <button id="logout" class="mini">Sign out</button></div></div><div id="stats" class="stats"></div><nav class="tabs"><button class="on" data-tab="books">Books</button><button data-tab="chapters">Chapters</button><button data-tab="support">Support</button><button data-tab="audit">Audit</button></nav><section id="books" data-panel></section><section id="chapters" data-panel class="hidden"></section><section id="support" data-panel class="hidden"></section><section id="audit" data-panel class="hidden"></section></section></main><script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const api=async(path,opt={})=>{const r=await fetch(path,{credentials:'same-origin',...opt,headers:{'content-type':'application/json',...(opt.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Object.assign(new Error(d.error||'request_failed'),{status:r.status});return d};
let status,books=[],activeBook=null;
function gate(html){$('#gate').classList.remove('hidden');$('#app').classList.add('hidden');$('#gate').innerHTML=html}
function loginGate(msg=''){gate('<h1>เข้าสู่ระบบ Admin</h1><p class="muted">ใช้ Email/Password เดียวกับบัญชี ASTRA Read</p>'+(msg?'<p class="err">'+esc(msg)+'</p>':'')+'<div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div><div class="field"><label>Password</label><input id="loginPassword" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn primary full">Sign In</button><p class="muted">ยังไม่มีบัญชี? <a href="https://astra-read-static.pages.dev/">สมัครจากหน้า Reader</a></p>');$('#loginBtn').onclick=login}
async function login(){const b=$('#loginBtn');b.disabled=true;try{await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:$('#loginEmail').value,password:$('#loginPassword').value})});location.reload()}catch(e){loginGate(e.message==='invalid_credentials'?'Email หรือ Password ไม่ถูกต้อง':e.message)}}
async function init(){try{status=await api('/api/admin/status');if(!status.signed_in)return loginGate();if(!status.owner_exists)return bootstrapGate();if(!status.user.role)return gate('<h1>ยังไม่มีสิทธิ์ Admin</h1><p class="muted">บัญชี <b>'+esc(status.user.email)+'</b> ยังไม่มี role owner/admin</p><button id="signOutGate" class="btn">Sign out</button>');$('#gate').classList.add('hidden');$('#app').classList.remove('hidden');$('#roleBadge').textContent=status.user.role.toUpperCase();$('#who').textContent=status.user.display_name+' · '+status.user.email;$('#logout').onclick=logout;await Promise.all([loadDashboard(),loadBooks()])}catch(e){loginGate(e.message)}}
function bootstrapGate(){gate('<h1>ตั้งค่า Owner ครั้งแรก</h1><p class="muted">บัญชี: <b>'+esc(status.user.email)+'</b></p><div class="notice">ใช้ Owner Bootstrap Token เพียงครั้งเดียว หลังสำเร็จ endpoint นี้จะปิด</div><div class="field"><label>Bootstrap Token</label><input id="bootToken" type="password" autocomplete="off"></div><button id="bootBtn" class="btn primary full">ตั้งบัญชีนี้เป็น Owner</button><p id="bootMsg"></p><button id="bootLogout" class="btn full">Sign out</button>');$('#bootBtn').onclick=bootstrap;$('#bootLogout').onclick=logout}
async function bootstrap(){const b=$('#bootBtn');b.disabled=true;try{await api('/api/admin/bootstrap',{method:'POST',body:JSON.stringify({token:$('#bootToken').value})});$('#bootMsg').className='ok';$('#bootMsg').textContent='สำเร็จ — กำลังเปิด Command Center';setTimeout(()=>location.reload(),450)}catch(e){$('#bootMsg').className='err';$('#bootMsg').textContent=e.message;b.disabled=false}}
async function logout(){await api('/api/admin/logout',{method:'POST',body:'{}'}).catch(()=>{});location.reload()}
async function loadDashboard(){const d=await api('/api/admin/dashboard'),s=d.stats;$('#stats').innerHTML=[['Books',s.books],['Chapters',s.chapters],['Users',s.users],['Open Support',s.open_support],['Audit',s.audit_events]].map(x=>'<div class="stat"><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('')}
async function loadBooks(){const d=await api('/api/admin/books');books=d.items||[];renderBooks()}
function renderBooks(){const p=$('#books');p.innerHTML='<div class="two"><div class="card panelCard"><div class="toolbar"><div><h2>Books</h2><p class="muted">'+books.length+' เรื่อง</p></div><button id="newBook" class="btn primary">＋ New Book</button></div><div class="list">'+(books.length?books.map(b=>'<div class="item"><div><h3>'+esc(b.title)+'</h3><small>'+esc(b.id)+' · '+esc(b.author)+' · '+esc(b.genre)+' · '+b.chapter_count+' ตอน</small></div><div class="actions"><button class="mini" data-edit-book="'+esc(b.id)+'">Edit</button><button class="mini" data-chapters="'+esc(b.id)+'">Chapters</button></div></div>').join(''):'<div class="empty">ยังไม่มี Book</div>')+'</div></div><div id="bookForm" class="card panelCard">'+bookForm()+'</div></div>';$('#newBook').onclick=()=>{$('#bookForm').innerHTML=bookForm();bindBookForm()};p.querySelectorAll('[data-edit-book]').forEach(x=>x.onclick=()=>{$('#bookForm').innerHTML=bookForm(books.find(b=>b.id===x.dataset.editBook));bindBookForm()});p.querySelectorAll('[data-chapters]').forEach(x=>x.onclick=()=>openChapters(x.dataset.chapters));bindBookForm()}
function bookForm(b={}){return '<h2>'+(b.id?'Edit Book':'Create Book')+'</h2><div class="field"><label>Slug / ID</label><input id="bId" '+(b.id?'disabled':'')+' value="'+esc(b.id||'')+'" placeholder="my-story"></div><div class="field"><label>ชื่อเรื่อง</label><input id="bTitle" value="'+esc(b.title||'')+'"></div><div class="row"><div class="field" style="flex:1"><label>ผู้เขียน</label><input id="bAuthor" value="'+esc(b.author||'')+'"></div><div class="field" style="flex:1"><label>Genre</label><input id="bGenre" value="'+esc(b.genre||'Fantasy')+'"></div></div><div class="row"><div class="field" style="flex:1"><label>Status</label><select id="bStatus"><option '+(b.status!=='Completed'?'selected':'')+'>Ongoing</option><option '+(b.status==='Completed'?'selected':'')+'>Completed</option></select></div><div class="field" style="flex:1"><label>Rating</label><input id="bRating" type="number" min="0" max="5" step="0.1" value="'+esc(b.rating??4.8)+'"></div><div class="field" style="flex:1"><label>Accent</label><input id="bAccent" value="'+esc(b.accent||'#5B5BD6')+'"></div></div><div class="field"><label>เรื่องย่อ</label><textarea id="bDesc">'+esc(b.description||'')+'</textarea></div><button id="saveBook" class="btn primary" data-editing="'+esc(b.id||'')+'">บันทึก</button> <span id="bookMsg" class="muted"></span>'}
function bindBookForm(){const s=$('#saveBook');if(!s)return;s.onclick=async()=>{const editing=s.dataset.editing,p={id:$('#bId').value.trim(),title:$('#bTitle').value,author:$('#bAuthor').value,genre:$('#bGenre').value,status:$('#bStatus').value,rating:Number($('#bRating').value),accent:$('#bAccent').value,description:$('#bDesc').value};s.disabled=true;try{await api(editing?'/api/admin/books/'+encodeURIComponent(editing):'/api/admin/books',{method:editing?'PUT':'POST',body:JSON.stringify(p)});$('#bookMsg').className='ok';$('#bookMsg').textContent='บันทึกแล้ว';await Promise.all([loadBooks(),loadDashboard()])}catch(e){$('#bookMsg').className='err';$('#bookMsg').textContent=e.message;s.disabled=false}}}
async function openChapters(id){activeBook=id;document.querySelector('[data-tab="chapters"]').click();await loadChapters()}
async function loadChapters(){if(!activeBook)activeBook=books[0]?.id;if(!activeBook){$('#chapters').innerHTML='<div class="empty">สร้าง Book ก่อน</div>';return}const d=await api('/api/admin/books/'+encodeURIComponent(activeBook)+'/chapters'),items=d.items||[];$('#chapters').innerHTML='<div class="two"><div class="card panelCard"><div class="toolbar"><div><h2>Chapters</h2><select id="chapterBook">'+books.map(b=>'<option value="'+esc(b.id)+'" '+(b.id===activeBook?'selected':'')+'>'+esc(b.title)+'</option>').join('')+'</select></div><button id="newChapter" class="btn primary">＋ New Chapter</button></div><div class="list">'+(items.length?items.map(c=>'<div class="item"><div><h3>#'+c.chapter_no+' '+esc(c.title)+'</h3><small>'+(Number(c.is_free)?'FREE':c.coin_price+' Coins')+' · '+c.body_chars+' chars</small></div><button class="mini" data-edit-chapter="'+esc(c.id)+'">Edit</button></div>').join(''):'<div class="empty">ยังไม่มีตอน</div>')+'</div></div><div id="chapterForm" class="card panelCard">'+chapterForm()+'</div></div>';$('#chapterBook').onchange=e=>{activeBook=e.target.value;loadChapters()};$('#newChapter').onclick=()=>{$('#chapterForm').innerHTML=chapterForm();bindChapterForm()};document.querySelectorAll('[data-edit-chapter]').forEach(x=>x.onclick=()=>editChapter(x.dataset.editChapter));bindChapterForm()}
function chapterForm(c={}){return '<h2>'+(c.id?'Edit Chapter':'Create Chapter')+'</h2><div class="field"><label>ตอนที่</label><input id="cNo" type="number" min="1" '+(c.id?'disabled':'')+' value="'+esc(c.chapter_no||'')+'"></div><div class="field"><label>ชื่อตอน</label><input id="cTitle" value="'+esc(c.title||'')+'"></div><div class="row"><label><input id="cFree" type="checkbox" style="width:auto" '+(c.id?Number(c.is_free)?'checked':'':'checked')+'> ฟรี</label><div class="field"><label>Coin Price</label><input id="cPrice" type="number" min="1" value="'+esc(c.coin_price||10)+'"></div></div><div class="field"><label>เนื้อหา</label><textarea id="cBody" class="chapterBody">'+esc(c.body||'')+'</textarea></div><button id="saveChapter" class="btn primary" data-editing="'+esc(c.id||'')+'">บันทึกตอน</button> <span id="chapterMsg" class="muted"></span>'}
function bindChapterForm(){const s=$('#saveChapter');if(!s)return;s.onclick=async()=>{const editing=s.dataset.editing,p={chapter_no:Number($('#cNo').value),title:$('#cTitle').value,body:$('#cBody').value,is_free:$('#cFree').checked,coin_price:Number($('#cPrice').value)};s.disabled=true;try{await api(editing?'/api/admin/chapters/'+encodeURIComponent(editing):'/api/admin/books/'+encodeURIComponent(activeBook)+'/chapters',{method:editing?'PUT':'POST',body:JSON.stringify(p)});$('#chapterMsg').className='ok';$('#chapterMsg').textContent='บันทึกแล้ว';await Promise.all([loadChapters(),loadDashboard(),loadBooks()])}catch(e){$('#chapterMsg').className='err';$('#chapterMsg').textContent=e.message;s.disabled=false}}}
async function editChapter(id){const d=await api('/api/admin/chapters/'+encodeURIComponent(id));$('#chapterForm').innerHTML=chapterForm(d.item);bindChapterForm()}
async function loadSupport(){const d=await api('/api/admin/support'),items=d.items||[];$('#support').innerHTML='<div class="card panelCard"><div class="toolbar"><div><h2>Support Inbox</h2><p class="muted">'+items.filter(x=>x.status==='open').length+' open</p></div><button id="refreshSupport" class="btn">Refresh</button></div><div class="list">'+(items.length?items.map(x=>'<div class="item"><div><h3>'+esc(x.category)+' · '+esc(x.id)+'</h3><small>'+esc(x.contact_email||'')+' '+esc(x.phone||'')+' · '+esc(x.created_at)+'</small><p class="supportMsg">'+esc(x.message)+'</p></div><button class="mini" data-support="'+esc(x.id)+'" data-status="'+(x.status==='open'?'closed':'open')+'">'+(x.status==='open'?'Close':'Reopen')+'</button></div>').join(''):'<div class="empty">ไม่มีรายการ</div>')+'</div></div>';$('#refreshSupport').onclick=loadSupport;document.querySelectorAll('[data-support]').forEach(b=>b.onclick=async()=>{await api('/api/admin/support/'+encodeURIComponent(b.dataset.support),{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await Promise.all([loadSupport(),loadDashboard()])})}
async function loadAudit(){const d=await api('/api/admin/audit'),items=d.items||[];$('#audit').innerHTML='<div class="card panelCard"><div class="toolbar"><h2>Audit Log</h2><button id="refreshAudit" class="btn">Refresh</button></div><div class="list audit">'+(items.length?items.map(x=>'<div class="item"><div><b>'+esc(x.action)+'</b> '+esc(x.entity_type)+' '+esc(x.entity_id||'')+'<br><small>'+esc(x.email||x.display_name||'system')+' · '+esc(x.created_at)+'</small></div></div>').join(''):'<div class="empty">ยังไม่มี audit event</div>')+'</div></div>';$('#refreshAudit').onclick=loadAudit}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=async()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('[data-panel]').forEach(x=>x.classList.toggle('hidden',x.id!==b.dataset.tab));if(b.dataset.tab==='chapters')await loadChapters();if(b.dataset.tab==='support')await loadSupport();if(b.dataset.tab==='audit')await loadAudit()});
document.addEventListener('click',e=>{if(e.target.id==='signOutGate')logout()});init();
</script></body></html>
